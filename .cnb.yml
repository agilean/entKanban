$:
  vscode:
    - docker:
        build: .ide/Dockerfile
      services:
        - vscode
        - docker
      env:
        # 每次打开 IDE 时由 cnb-welcome 插件自动执行，确保 pnpm 可用
        CNB_WELCOME_CMD: corepack enable
      stages:
        - name: setup
          script: bash scripts/setup.sh

main:
  push:
    - name: ci
      docker:
        image: node:22
      stages:
        - name: setup
          script: |
            corepack enable
            pnpm install --frozen-lockfile
        - name: test
          script: pnpm test
        - name: build
          script: pnpm build

  pull_request:
    - name: ci
      docker:
        image: node:22
      stages:
        - name: setup
          script: |
            corepack enable
            pnpm install --frozen-lockfile
        - name: test
          script: pnpm test
        - name: build
          script: pnpm build
