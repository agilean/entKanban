# Render Blueprint: single Web Service serves API + Vue SPA (same origin for Feishu OAuth cookies).
# Dashboard: New → Blueprint → connect adwu73/entKanban → Deploy.

services:
  - type: web
    name: entkanban
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install &&
      pnpm --filter @kanban-game/engine build &&
      pnpm --filter @kanban-game/web build &&
      pnpm --filter @kanban-game/server build
    startCommand: node --experimental-sqlite packages/server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: COOKIE_SECURE
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      # RENDER_EXTERNAL_URL is set automatically; config derives WEB_ORIGIN and OAuth callback if omitted.
      - key: WEB_ORIGIN
        sync: false
      - key: FEISHU_REDIRECT_URI
        sync: false
      - key: LOG_ACCESS_TOKEN
        generateValue: true
